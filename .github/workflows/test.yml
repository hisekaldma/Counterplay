name: Test
on:
  push: { branches: [main] }
  pull_request:

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift build --build-tests
      - run: swift test

  linux:
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - run: swift build --build-tests
      - run: swift test
